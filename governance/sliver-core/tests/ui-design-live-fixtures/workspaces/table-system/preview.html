<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Synthetic table workspace</title>
    <style>
      body { margin: 0; background: #eef2ff; color: #172033; font: 16px system-ui; }
      main { max-width: 960px; margin: 40px auto; padding: 24px; }
      table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 8px 28px #64748b33; }
      th, td { padding: 12px 16px; border-bottom: 1px solid #dbe3f0; text-align: left; }
      th { background: #273b72; color: white; }
      .status { color: #176b4d; font-weight: 700; }
    </style>
  </head>
  <body><main id="app"></main><script type=module src="./src/pages/records.js"></script></body>
</html>
