name: Validate full live release evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Required external fresh-session evidence producer run for this exact commit"
        required: true
        type: string
      artifact_name:
        description: "Artifact containing task-decision-live-results.json, foundation-live-results.json, ui-design-live-results.json, studio-live-results.json, and all referenced raw evidence"
        required: true
        default: "sliver-live-evidence"
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    environment: sliver-live-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRODUCER_WORKFLOW_PATH: ${{ vars.SLIVER_TRUSTED_PRODUCER_WORKFLOW }}
          PRODUCER_WORKFLOW_SHA256: ${{ vars.SLIVER_TRUSTED_PRODUCER_WORKFLOW_SHA256 }}
        with:
          script: |
            const crypto = require('crypto');
            if (!/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID || '')) {
              core.setFailed('Evidence source_run_id must be a positive integer');
              return;
            }
            if (!/^\.github\/workflows\/[A-Za-z0-9_.-]+\.ya?ml$/.test(process.env.PRODUCER_WORKFLOW_PATH || '')) {
              core.setFailed('protected producer workflow allowlist is missing or invalid');
              return;
            }
            if (!/^[0-9a-f]{64}$/.test(process.env.PRODUCER_WORKFLOW_SHA256 || '')) {
              core.setFailed('protected producer workflow digest is missing or invalid');
              return;
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.SOURCE_RUN_ID)
            });
            if (run.data.path !== process.env.PRODUCER_WORKFLOW_PATH) {
              core.setFailed(`Evidence run path ${run.data.path} does not match ${process.env.PRODUCER_WORKFLOW_PATH}`);
            }
            if (run.data.head_sha !== context.sha) {
              core.setFailed(`Evidence run commit ${run.data.head_sha} does not match candidate ${context.sha}`);
            }
            if (run.data.conclusion !== 'success') {
              core.setFailed(`Evidence source run must have succeeded; got ${run.data.conclusion}`);
            }
            const workflow = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: process.env.PRODUCER_WORKFLOW_PATH,
              ref: run.data.head_sha
            });
            if (Array.isArray(workflow.data) || !workflow.data.content) {
              core.setFailed('Protected producer workflow content is unavailable');
              return;
            }
            const digest = crypto.createHash('sha256')
              .update(Buffer.from(workflow.data.content, workflow.data.encoding || 'base64'))
              .digest('hex');
            if (digest !== process.env.PRODUCER_WORKFLOW_SHA256) {
              core.setFailed(`Producer workflow digest ${digest} does not match protected policy`);
            }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/sliver-live-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - run: >-
          python3 -B scripts/validate_release_candidate.py
          --task-decision-results "$LIVE_RESULTS_DIR/task-decision-live-results.json"
          --foundation-results "$LIVE_RESULTS_DIR/foundation-live-results.json"
          --ui-results "$LIVE_RESULTS_DIR/ui-design-live-results.json"
          --studio-results "$LIVE_RESULTS_DIR/studio-live-results.json"
          --expected-producer-run-id "$SOURCE_RUN_ID"
          --expected-producer-repository "$PRODUCER_REPOSITORY"
          --expected-producer-workflow-path "$PRODUCER_WORKFLOW_PATH"
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_WORKFLOW_PATH: ${{ vars.SLIVER_TRUSTED_PRODUCER_WORKFLOW }}
          LIVE_RESULTS_DIR: ${{ runner.temp }}/sliver-live-results
